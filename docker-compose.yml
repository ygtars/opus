services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-task-manager
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/data.sqlite
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:
